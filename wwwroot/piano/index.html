<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111127"><title>빛을 연주하다</title><link rel="stylesheet" href="/piano/visitor.css?v=3"></head>
<body><main>
  <header><span class="wordmark">빛을 연주하다<span>LIGHT PIANO</span></span><button id="fullscreen" aria-label="전체 화면" type="button">⛶</button></header>
  <section class="invitation"><p class="eyebrow">YOUR TOUCH, YOUR COLORS</p><h1>손끝에서 피어나는 빛</h1><p id="status" role="status">가운데 건반부터, 나만의 멜로디를 만들어 보세요.</p></section>
  <div id="ribbons" class="ribbons" aria-hidden="true"></div>
  <section class="instrument" aria-label="피아노"><div class="range-labels"><span>← 낮은 음</span><strong>가운데 음역 · 도 레 미 파 솔 라 시 도</strong><span>높은 음 →</span></div><div id="keyboard" class="keyboard"><div id="lowKeys" class="key-range low" aria-label="낮은 음역"></div><div id="middleKeys" class="key-range middle" aria-label="가운데 음역"></div><div id="highKeys" class="key-range high" aria-label="높은 음역"></div></div></section>
  <footer><span>여러 건반을 함께 눌러도 좋아요</span><span>TOUCH · PLAY · GLOW</span></footer>
  <div id="welcome" class="welcome"><div><p class="eyebrow">A LITTLE MOMENT OF MUSIC</p><h2>어떤 색의 음악을<br>만들어 볼까요?</h2><button id="begin" type="button">터치하여 연주하기 <span>→</span></button><p id="welcomeStatus" role="status">건반을 누르면 소리와 빛이 함께 피어나요</p></div></div>
</main><script src="/piano-core.js?v=2"></script><script src="/piano/visitor.js?v=3"></script></body>
</html>
